  <path d="M 21 31 Q 32 34 43 31" stroke="#78350f" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
  <!-- Patch -->
  <rect x="25" y="38" width="7" height="7" rx="1" fill="#fde047" opacity="0.9" stroke="#b45309" stroke-width="1"/>
